services:
  api:
    build:
      context: .
      target: builder
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm run migrate && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-device_inspector}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-device_inspector}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-devices:
    build:
      context: .
      dockerfile: mock_service/Dockerfile
    ports:
      - "9001-9004:9001-9004"
      - "9102:9102"

volumes:
  postgres_data:
